<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SQL Quest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 40px;
            border-bottom: 1px solid #e0e0e0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: bold;
            color: #2e7d32;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 32px;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-size: 15px;
        }

        nav a:hover {
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <span>🕵️</span>
            <span>SQL Quest</span>
        </div>
        <nav>
            <ul>
                <li><a href="#mission">Миссия</a></li>
                <li><a href="#quests">Квесты</a></li>
                <li><a href="#facts">Факты</a></li>
                <li><a href="#join">Присоединиться</a></li>
                <li><a href="#contacts">Контакты</a></li>
            </ul>
        </nav>
    </header>
</body>
</html>
